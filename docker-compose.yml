services:
  openplc:
    image: tuttas/openplc_v3:latest
    platform: linux/amd64
    container_name: attraction-openplc
    ports:
      - "8080:8080"   # OpenPLC Web Interface
      - "502:502"     # Modbus TCP
    volumes:
      - openplc-data:/workdir
      - ./scripts/attraction_control.st:/workdir/st_files/attraction_control.st:ro
    environment:
      - OPENPLC_PASSWORD=openplc
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  openplc-data:
